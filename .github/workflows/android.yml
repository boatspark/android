name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Android SDK packages
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install
          "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Test, lint, and build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      # Exercises R8 shrinking, which debug builds skip; CI has no signing key.
      - name: Build release
        run: ./gradlew :app:assembleRelease -Pboatspark.allowUnsignedRelease=true
