name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Install devcontainer CLI
        run: npm install --global @devcontainers/cli@0.90.0
      - name: Provide USB mount source
        run: sudo mkdir -p /dev/bus/usb
      - name: Verify Android container
        run: ./scripts/check-android-env
      - name: Test, lint, and build
        run: ./scripts/android --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
